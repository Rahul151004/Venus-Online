services:
  server:
    build: ./server
    image: rbhat04/venus-server:latest
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env

  client:
    build:
      context: ./client
      args:
        - VITE_API_URL=${VITE_API_URL}
    image: rbhat04/venus-client:latest
    ports:
      - "3000:80"
    depends_on:
      - server
